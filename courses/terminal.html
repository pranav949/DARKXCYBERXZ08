<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DX08_TERMINAL // Dedicated Console</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #020309;
            color: #00e5ff;
            font-family: monospace;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        .terminal-page-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(0, 229, 255, 0.3);
            background: rgba(0, 10, 20, 0.95);
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.1);
        }
        .terminal-header-bar {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(0, 229, 255, 0.3);
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .back-btn {
            color: #ff2daa;
            text-decoration: none;
            font-weight: bold;
        }
        .term-output-area {
            flex: 1;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .term-input-row {
            display: flex;
            align-items: center;
            border-top: 1px solid rgba(0, 229, 255, 0.2);
            padding-top: 10px;
        }
        .term-input-row span {
            margin-right: 8px;
            color: #ff2daa;
        }
        #page-terminal-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #00e5ff;
            font-family: monospace;
            font-size: 13px;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="terminal-page-container">
        <div class="terminal-header-bar">
            <span>DX08_TERMINAL // SECURE CONSOLE v2.0</span>
            <a href="index.html" class="back-btn">[ ← BACK TO HOME ]</a>
        </div>
        
        <div id="page-terminal-output" class="term-output-area">
            <div>> SECURE CONNECTION ESTABLISHED.</div>
            <div>> SYSTEM INITIALIZED... TYPE 'help' FOR COMMANDS.</div>
        </div>

        <div class="term-input-row">
            <span>></span>
            <input type="text" id="page-terminal-input" placeholder="try 'scan', 'status', 'help'..." autofocus autocomplete="off">
        </div>
    </div>

    <script>
        const input = document.getElementById("page-terminal-input");
        const output = document.getElementById("page-terminal-output");

        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                const cmd = input.value.trim().toLowerCase();
                if (!cmd) return;

                output.innerHTML += `<div>> ${cmd}</div>`;
                input.value = "";

                let response = "";
                switch (cmd) {
                    case "help":
                        response = "AVAILABLE COMMANDS: scan, status, labs, clear, whoami";
                        break;
                    case "scan":
                        response = "SCANNING NODE_08... ALL PORTS SECURE & ENCRYPTED.";
                        break;
                    case "status":
                        response = "SYS://ONLINE. FIREWALL ACTIVE. SANDBOX SAFE.";
                        break;
                    case "labs":
                        response = "LOADED LABS: WEB, NETWORK, AI, FORENSICS.";
                        break;
                    case "whoami":
                        response = "USER: GUEST_RESEARCHER // LEVEL_1 CLEARANCE.";
                        break;
                    case "clear":
                        output.innerHTML = "> TERMINAL RESET.";
                        return;
                    default:
                        response = `COMMAND NOT RECOGNIZED: '${cmd}'. TYPE 'help'.`;
                        break;
                }

                output.innerHTML += `<div>${response}</div>`;
                output.scrollTop = output.scrollHeight;
            }
        });
    </script>
</body>
</html>
