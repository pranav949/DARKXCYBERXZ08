<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DX08 // SECURE SYSTEM TERMINAL & LAB</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #030303;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* Top Navigation Bar */
        .term-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #080c10;
            padding: 12px 20px;
            border-bottom: 1px solid rgba(0, 255, 102, 0.2);
        }
        .term-title {
            font-size: 13px;
            color: #00ffff;
            font-weight: bold;
            letter-spacing: 0.1em;
        }
        .back-btn {
            background: rgba(0, 255, 102, 0.1);
            color: #00ff66;
            border: 1px solid rgba(0, 255, 102, 0.4);
            padding: 5px 12px;
            font-size: 11px;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }
        .back-btn:hover {
            background: #00ff66;
            color: #030303;
        }

        /* Main Workspace Layout */
        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 45px);
            overflow: hidden;
        }

        /* Sidebar for Files */
        .sidebar {
            width: 250px;
            background: #05080a;
            border-right: 1px solid rgba(0, 255, 102, 0.15);
            display: flex;
            flex-direction: column;
        }
        .sidebar-title {
            padding: 12px;
            font-size: 11px;
            color: #ff0055;
            background: rgba(255, 0, 85, 0.05);
            border-bottom: 1px solid rgba(0, 255, 102, 0.1);
            letter-spacing: 0.08em;
        }
        .file-list {
            list-style: none;
            padding: 10px;
            overflow-y: auto;
            flex: 1;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            font-size: 12px;
            color: #8be9fd;
            cursor: pointer;
            margin-bottom: 4px;
            border-radius: 3px;
            background: rgba(255,255,255,0.02);
        }
        .file-item:hover {
            background: rgba(0, 255, 102, 0.08);
            color: #00ff66;
        }
        .new-file-btn {
            margin: 10px;
            padding: 8px;
            background: rgba(0, 255, 102, 0.1);
            border: 1px dashed rgba(0, 255, 102, 0.4);
            color: #00ff66;
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
            text-align: center;
        }
        .new-file-btn:hover {
            background: rgba(0, 255, 102, 0.2);
        }

        /* Terminal Screen Area */
        .terminal-main {
            flex: 1;
            background: #020202;
            display: flex;
            flex-direction: column;
            padding: 15px;
            overflow: hidden;
        }
        #terminal-body {
            flex: 1;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .input-line {
            display: flex;
            align-items: center;
            margin-top: 10px;
            border-top: 1px solid rgba(0, 255, 102, 0.1);
            padding-top: 10px;
        }
        #prompt-dir {
            color: #ff79c6;
            margin-right: 8px;
            font-weight: bold;
        }
        #command-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
        }

        /* Command Output Colors */
        .output-line.error { color: #ff5555; }
        .output-line.success { color: #50fa7b; }
        .output-line.warn { color: #f1fa8c; }
        .output-line.info { color: #8be9fd; }

        /* Modal Code Editor (Nano simulation) */
        #editor-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .editor-box {
            width: 700px;
            height: 450px;
            background: #0a0f14;
            border: 1px solid #00ff66;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.15);
        }
        .editor-header {
            background: #111822;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            color: #00ffff;
            font-size: 12px;
            border-bottom: 1px solid rgba(0, 255, 102, 0.2);
        }
        #editor-textarea {
            flex: 1;
            background: #05080c;
            color: #00ff66;
            border: none;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            outline: none;
            resize: none;
            line-height: 1.4;
        }
        .editor-footer {
            padding: 10px 15px;
            background: #111822;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .editor-btn {
            padding: 5px 15px;
            background: rgba(0, 255, 102, 0.15);
            border: 1px solid #00ff66;
            color: #00ff66;
            font-family: inherit;
            cursor: pointer;
            font-size: 11px;
        }
        .editor-btn.save { background: #00ff66; color: #030303; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="term-header">
        <div class="term-title">DX08 // SECURE RESEARCH TERMINAL & LAB</div>
        <a href="index.html" class="back-btn">← BACK TO MAIN SITE</a>
    </header>

    <!-- Workspace Area -->
    <div class="workspace">
        <!-- Sidebar File Explorer -->
        <div class="sidebar">
            <div class="sidebar-title">VIRTUAL FILE SYSTEM</div>
            <button class="new-file-btn" onclick="createNewFilePrompt()">+ NEW FILE</button>
            <ul class="file-list" id="file-list">
                <!-- Dynamically populated files -->
            </ul>
        </div>

        <!-- Terminal Screen -->
        <div class="terminal-main">
            <div id="terminal-body">
                <div class="output-line success">DARKXCYBERXZ08 KERNEL v3.0 [SECURE SANDBOX ENVIRONMENT]</div>
                <div class="output-line info">Type 'help' to see available terminal and file commands. Type 'nano &lt;file&gt;' to edit code.</div>
                <br>
            </div>
            <div class="input-line">
                <span id="prompt-dir">root@dx08:~#</span>
                <input type="text" id="command-input" autofocus autocomplete="off" placeholder="Type a command...">
            </div>
        </div>
    </div>

    <!-- Built-in Code Editor Modal (Nano style) -->
    <div id="editor-modal">
        <div class="editor-box">
            <div class="editor-header">
                <span id="editor-file-title">Editing: script.py</span>
                <span>[DX08 TEXT EDITOR]</span>
            </div>
            <textarea id="editor-textarea"></textarea>
            <div class="editor-footer">
                <button class="editor-btn" onclick="closeEditor()">Cancel</button>
                <button class="editor-btn save" onclick="saveFileFromEditor()">Save Changes</change>
            </div>
        </div>
    </div>

    <!-- Terminal & VFS Logic Script -->
    <script>
        const terminalBody = document.getElementById('terminal-body');
        const commandInput = document.getElementById('command-input');
        const fileListElement = document.getElementById('file-list');
        const editorModal = document.getElementById('editor-modal');
        const editorTextarea = document.getElementById('editor-textarea');
        const editorFileTitle = document.getElementById('editor-file-title');

        let currentActiveFile = null;
        let currentPath = "/root";

        // Virtual File System initialization
        let virtualFileSystem = JSON.parse(localStorage.getItem('dx08_vfs')) || {
            "/root/script.py": "# Python Development Script\nprint('Hello from DX08 Terminal Shell!')\n",
            "/root/notes.txt": "System Security & Lab Notes\n- Always test scripts locally.\n"
        };

        refreshSidebar();

        commandInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const cmdLine = commandInput.value.trim();
                if (!cmdLine) return;

                appendOutput(document.getElementById('prompt-dir').textContent + " " + cmdLine, 'user');
                processCommand(cmdLine);

                commandInput.value = '';
            }
        });

        function appendOutput(text, type, isHTML) {
            type = type || 'normal';
            isHTML = isHTML || false;
            const div = document.createElement('div');
            div.className = 'output-line';

            if (type === 'user') div.style.color = '#fff';
            else if (type === 'error') div.className += ' error';
            else if (type === 'success') div.className += ' success';
            else if (type === 'warn') div.className += ' warn';
            else if (type === 'info') div.className += ' info';

            if (isHTML) div.innerHTML = text;
            else div.textContent = text;

            terminalBody.appendChild(div);
            terminalBody.scrollTop = terminalBody.scrollHeight;
        }

        function processCommand(input) {
            const parts = input.split(' ');
            const cmd = parts[0].toLowerCase();
            const arg1 = parts[1] || '';

            switch (cmd) {
                case 'help':
                    appendOutput("SYSTEM COMMAND MANUAL:\n" +
                        "  ls                 : List files in workspace\n" +
                        "  cat <file>         : Display file content\n" +
                        "  touch <file>       : Create empty file\n" +
                        "  nano <file>        : Open interactive code editor[cite: 8]\n" +
                        "  python3 <file>     : Execute Python script (simulation)[cite: 8]\n" +
                        "  rm <file>          : Remove a file[cite: 8]\n" +
                        "  clear              : Clear terminal screen[cite: 8]\n" +
                        "  pwd                : Display current working directory[cite: 8]\n" +
                        "  download <file>    : Download file to local PC[cite: 8]", 'info');
                    break;

                case 'ls':
                    let files = Object.keys(virtualFileSystem);
                    if (files.length === 0) {
                        appendOutput("[Workspace empty]", 'warn');
                    } else {
                        files.forEach(f => {
                            const filename = f.replace('/root/', '');
                            appendOutput(" - " + filename, 'success');
                        });
                    }
                    break;

                case 'pwd':
                    appendOutput(currentPath, 'info');
                    break;

                case 'clear':
                    clearTerminal();
                    break;

                case 'touch':
                    if (!arg1) {
                        appendOutput("Usage: touch <filename>", 'error');
                        break;
                    }
                    let filePath = "/root/" + arg1;
                    if (!virtualFileSystem[filePath]) {
                        virtualFileSystem[filePath] = "";
                        saveVFS();
                        refreshSidebar();
                        appendOutput("[+] Created file: " + arg1, 'success');
                    } else {
                        appendOutput("[!] File already exists.", 'warn');
                    }
                    break;

                case 'cat':
                    if (!arg1) {
                        appendOutput("Usage: cat <filename>", 'error');
                        break;
                    }
                    let catPath = "/root/" + arg1;
                    if (virtualFileSystem[catPath] !== undefined) {
                        appendOutput(virtualFileSystem[catPath] || "[File Empty]", 'normal');
                    } else {
                        appendOutput("cat: " + arg1 + ": No such file", 'error');
                    }
                    break;

                case 'nano':
                    if (!arg1) {
                        appendOutput("Usage: nano <filename>", 'error');
                        break;
                    }
                    openEditor("/root/" + arg1);
                    break;

                case 'python3':
                case 'python':
                    if (!arg1) {
                        appendOutput("Usage: python3 <script.py>", 'error');
                        break;
                    }
                    let pyPath = "/root/" + arg1;
                    if (virtualFileSystem[pyPath] !== undefined) {
                        appendOutput("[*] Executing " + arg1 + "...", 'info');
                        appendOutput("--- OUTPUT START ---", 'warn');
                        appendOutput(virtualFileSystem[pyPath], 'normal');
                        appendOutput("--- OUTPUT END --- [Process finished with exit code 0]", 'success');
                    } else {
                        appendOutput("python3: can't open file '" + arg1 + "': No such file", 'error');
                    }
                    break;

                case 'rm':
                    if (!arg1) {
                        appendOutput("Usage: rm <filename>", 'error');
                        break;
                    }
                    let rmPath = "/root/" + arg1;
                    if (virtualFileSystem[rmPath] !== undefined) {
                        delete virtualFileSystem[rmPath];
                        saveVFS();
                        refreshSidebar();
                        appendOutput("[+] Removed " + arg1, 'success');
                    } else {
                        appendOutput("rm: cannot remove '" + arg1 + "': No such file", 'error');
                    }
                    break;

                case 'download':
                    if (!arg1) {
                        appendOutput("Usage: download <filename>", 'error');
                        break;
                    }
                    let dlPath = "/root/" + arg1;
                    if (virtualFileSystem[dlPath] !== undefined) {
                        downloadFile(arg1, virtualFileSystem[dlPath]);
                        appendOutput("[+] Downloading " + arg1, 'success');
                    } else {
                        appendOutput("File not found for download.", 'error');
                    }
                    break;

                default:
                    appendOutput("bash: " + cmd + ": command not found. Type 'help' for valid commands.", 'error');
                    break;
            }
        }

        function refreshSidebar() {
            fileListElement.innerHTML = '';
            Object.keys(virtualFileSystem).forEach(fullPath => {
                const fileName = fullPath.replace('/root/', '');
                const li = document.createElement('li');
                li.className = 'file-item';
                li.innerHTML = `<span>📄 ${fileName}</span> <span style="color:#ff0055; cursor:pointer;" onclick="deleteFile('${fullPath}')">×</span>`;
                li.querySelector('span').onclick = () => openEditor(fullPath);
                fileListElement.appendChild(li);
            });
        }

        function createNewFilePrompt() {
            const name = prompt("Enter new filename (e.g. script.py, notes.txt):");
            if (name) {
                let path = "/root/" + name;
                virtualFileSystem[path] = "# New file\n";
                saveVFS();
                refreshSidebar();
                appendOutput("[+] File created: " + name, 'success');
            }
        }

        function openEditor(fullPath) {
            currentActiveFile = fullPath;
            if (virtualFileSystem[fullPath] === undefined) {
                virtualFileSystem[fullPath] = "";
            }
            editorFileTitle.textContent = "Editing: " + fullPath.replace('/root/', '');
            editorTextarea.value = virtualFileSystem[fullPath];
            editorModal.style.display = 'flex';
        }

        function saveFileFromEditor() {
            if (currentActiveFile) {
                virtualFileSystem[currentActiveFile] = editorTextarea.value;
                saveVFS();
                refreshSidebar();
                appendOutput("[+] Saved changes to " + currentActiveFile.replace('/root/', ''), 'success');
            }
            closeEditor();
        }

        function closeEditor() {
            editorModal.style.display = 'none';
            currentActiveFile = null;
        }

        function deleteFile(fullPath) {
            if (confirm("Delete " + fullPath + "?")) {
                delete virtualFileSystem[fullPath];
                saveVFS();
                refreshSidebar();
            }
        }

        function saveVFS() {
            localStorage.setItem('dx08_vfs', JSON.stringify(virtualFileSystem));
        }

        function clearTerminal() {
            terminalBody.innerHTML = '<div class="output-line success">[+] TERMINAL BUFFER CLEARED.</div><br>';
        }

        function downloadFile(filename, text) {
            const element = document.createElement('a');
            element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
            element.setAttribute('download', filename);
            element.style.display = 'none';
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
        }
    </script>
</body>
</html>
