<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARKXCYBERXZ08 // ELITE CYBER WAR ROOM & IDE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #020403;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .war-header {
            background: #060e09;
            border-bottom: 2px solid #00ff66;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
        }
        .war-logo { font-weight: bold; color: #00ffff; letter-spacing: 2px; }
        .war-btns { display: flex; gap: 10px; }
        .war-btn {
            background: rgba(0, 255, 102, 0.08);
            border: 1px solid #00ff66; color: #00ff66;
            padding: 6px 14px; border-radius: 4px; cursor: pointer;
            font-family: inherit; font-size: 12px; font-weight: bold;
        }
        .war-btn:hover { background: rgba(0, 255, 102, 0.3); box-shadow: 0 0 10px #00ff66; }
        .war-btn.active { background: #00ff66; color: #020403; }
        .war-btn.danger { border-color: #ff0055; color: #ff0055; background: rgba(255, 0, 85, 0.08); }
        .war-workspace { flex: 1; display: flex; overflow: hidden; }
        .view-section { flex: 1; display: none; height: 100%; }
        .view-section.active { display: flex; }
        .sidebar { width: 250px; background: #040806; border-right: 1px solid rgba(0, 255, 102, 0.3); display: flex; flex-direction: column; padding: 12px; }
        .sidebar h4 { color: #00ffff; font-size: 11px; margin-bottom: 10px; border-bottom: 1px solid rgba(0, 255, 255, 0.3); padding-bottom: 5px; }
        .file-list { list-style: none; flex: 1; overflow-y: auto; }
        .file-item { padding: 8px 10px; margin-bottom: 4px; cursor: pointer; border-radius: 4px; font-size: 13px; background: rgba(0, 255, 102, 0.03); border: 1px solid rgba(0, 255, 102, 0.1); }
        .file-item:hover { background: rgba(0, 255, 102, 0.1); }
        .file-item.active { background: rgba(0, 255, 102, 0.2); border-color: #00ff66; color: #fff; }
        .editor-pane, .preview-pane { flex: 1; display: flex; flex-direction: column; background: #020403; border-right: 1px solid rgba(0, 255, 102, 0.3); }
        .pane-header { background: #050a07; padding: 8px 15px; font-size: 12px; color: #00ffff; border-bottom: 1px solid rgba(0, 255, 102, 0.3); display: flex; justify-content: space-between; }
        #code-editor { flex: 1; background: #020403; color: #00ff66; border: none; padding: 15px; font-family: 'Courier New', Courier, monospace; font-size: 14px; outline: none; resize: none; line-height: 1.5; }
        #live-preview { flex: 1; border: none; background: #fff; width: 100%; height: 100%; }
        .terminal-container { flex: 1; background: #020403; display: flex; flex-direction: column; padding: 15px; }
        #terminal-output { flex: 1; overflow-y: auto; font-size: 13px; line-height: 1.5; display: flex; flex-direction: column; gap: 6px; }
        .terminal-input-wrap { display: flex; align-items: center; border-top: 1px solid rgba(0, 255, 102, 0.3); padding-top: 10px; margin-top: 10px; }
        #terminal-input { flex: 1; background: transparent; border: none; color: #fff; font-family: 'Courier New', Courier, monospace; font-size: 14px; outline: none; }
        .t-success { color: #00ff66; } .t-error { color: #ff0055; font-weight: bold; } .t-warn { color: #ffcc00; } .t-info { color: #00ffff; }
    </style>
</head>
<body>

    <div class="war-header">
        <span class="war-logo">🛡️ DARKXCYBERXZ08 // WAR ROOM & IDE</span>
        <div class="war-btns">
            <button class="war-btn active" id="btn-ide" onclick="switchView('ide')">[ WEB IDE & PREVIEW ]</button>
            <button class="war-btn" id="btn-term" onclick="switchView('terminal')">[ HACKER TERMINAL ]</button>
            <button class="war-btn" onclick="saveWorkspace()">💾 SAVE PROJECT</button>
            <a href="index.html" style="text-decoration:none;"><button class="war-btn danger">EXIT</button></a>
        </div>
    </div>

    <div class="war-workspace">
        <div id="view-ide" class="view-section active">
            <div class="sidebar">
                <h4>PROJECT FILES</h4>
                <ul id="file-list" class="file-list"></ul>
                <button class="war-btn" style="margin-top: 10px;" onclick="createNewFile()">+ NEW FILE</button>
            </div>
            <div class="editor-pane">
                <div class="pane-header">
                    <span id="active-file-label">index.html</span>
                    <span style="color: #00ff66;">STATUS: EDITING</span>
                </div>
                <textarea id="code-editor" spellcheck="false"></textarea>
            </div>
            <div class="preview-pane">
                <div class="pane-header" style="background: #111; color: #fff;">
                    <span>LIVE OUTPUT PREVIEW</span>
                    <span style="color: #00ff66;">● LIVE SYNC</span>
                </div>
                <iframe id="live-preview"></iframe>
            </div>
        </div>

        <div id="view-term" class="view-section">
            <div class="terminal-container">
                <div id="terminal-output">
                    <div class="t-success">[+] DARKXCYBERXZ08 KERNEL SHELL v5.0 SECURED.</div>
                    <div class="t-info">[*] Type 'help' to check available cyber commands.</div>
                    <br>
                </div>
                <div class="terminal-input-wrap">
                    <span style="color: #00ff66; margin-right: 8px; font-weight: bold;">dx08@war-room:~#</span>
                    <input type="text" id="terminal-input" autofocus autocomplete="off" spellcheck="false" placeholder="Type command here...">
                </div>
            </div>
        </div>
    </div>

    <!-- External Script attached cleanly -->
    <script src="war-script.js"></script>
</body>
</html>
