<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DX08 ELITE HACKING KERNEL // HYDRA ENGINE v3.0</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #050505;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .term-header {
            background: #111;
            border-bottom: 1px solid #333;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }
        .term-header a {
            color: #ff3333;
            text-decoration: none;
            border: 1px solid #ff3333;
            padding: 3px 8px;
            border-radius: 3px;
            font-weight: bold;
        }
        .term-body {
            flex: 1;
            padding: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #000;
        }
        #term-screen {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 13px;
            line-height: 1.4;
            word-break: break-all;
        }
        .prompt-line {
            display: flex;
            align-items: center;
            margin-top: 6px;
            background: #0a0a0a;
            padding: 6px 8px;
            border-radius: 4px;
            border: 1px solid #222;
        }
        .p-user { color: #00ff66; font-weight: bold; margin-right: 6px; font-size: 12px; }
        #term-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            outline: none;
        }
        .t-green { color: #00ff66; }
        .t-red { color: #ff3333; font-weight: bold; }
        .t-yellow { color: #f1fa8c; }
        .t-cyan { color: #8be9fd; }
        .t-purple { color: #bd93f9; }
    </style>
</head>
<body>

    <div class="term-header">
        <span id="path-label" style="color: #00ffff; font-weight: bold;">root@dx08:~#</span>
        <a href="terminal.html">EXIT SHELL</a>
    </div>

    <div class="term-body">
        <div id="term-screen">
            <div class="t-green">==================================================</div>
            <div class="t-cyan">   DX08 KERNEL: VFS + HYDRA BRUTE-FORCE ENGINE    </div>
            <div class="t-green">==================================================</div>
            <div class="t-yellow">[*] Type <span style="color:#ff3333">help</span> or <span style="color:#ff3333">hydra</span> to run attack simulation.</div>
            <br>
        </div>

        <div class="prompt-line">
            <span class="p-user" id="prompt-symbol">root@dx08:~#</span>
            <input type="text" id="term-input" autofocus autocomplete="off" spellcheck="false" placeholder="Type command...">
        </div>
    </div>

    <script>
        const screen = document.getElementById('term-screen');
        const input = document.getElementById('term-input');
        const promptSymbol = document.getElementById('prompt-symbol');
        const pathLabel = document.getElementById('path-label');

        let vfs = JSON.parse(localStorage.getItem('dx08_vfs')) || {
            "/": {
                type: "dir",
                content: {
                    "readme.txt": { type: "file", content: "Welcome to DX08 Secure Environment. All systems operational." },
                    "wordlist.txt": { type: "file", content: "admin123\nroot\npassword\nsecret123\nhackme" }
                }
            }
        };

        let currentPath = "/";

        function saveVFS() {
            localStorage.setItem('dx08_vfs', JSON.stringify(vfs));
        }

        function getDirByPath(path) {
            if (path === "/") return vfs["/"];
            let parts = path.split("/").filter(p => p);
            let curr = vfs["/"];
            for (let p of parts) {
                if (curr.content[p] && curr.content[p].type === "dir") {
                    curr = curr.content[p];
                } else {
                    return null;
                }
            }
            return curr;
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                let cmd = input.value.trim();
                input.value = ''; 
                if (!cmd) return;
                
                printLine(promptSymbol.textContent + " + " + cmd, 'user');
                // fix display text format
                let historyDiv = screen.lastChild;
                historyDiv.textContent = promptSymbol.textContent + " " + cmd;

                executeCommand(cmd);
            }
        });

        function printLine(text, type) {
            let div = document.createElement('div');
            if (type === 'user') div.style.color = '#fff';
            else if (type === 'success') div.className = 't-green';
            else if (type === 'error') div.className = 't-red';
            else if (type === 'warn') div.className = 't-yellow';
            else if (type === 'info') div.className = 't-cyan';
            else if (type === 'purple') div.className = 't-purple';
            div.textContent = text;
            screen.appendChild(div);
            screen.scrollTop = screen.scrollHeight;
        }

        function executeCommand(command) {
            let parts = command.split(' ');
            let mainCmd = parts[0].toLowerCase();
            let arg = parts[1];

            let activeDir = getDirByPath(currentPath);

            switch(mainCmd) {
                case 'help':
                    printLine("COMMAND MANUAL:\n  ls               - List files and directories\n  mkdir <name>     - Create directory\n  touch <file>     - Create file\n  cat <file>       - Read file content\n  rm <name>        - Delete file/dir\n  cd <dir>         - Change directory\n  pwd              - Print working directory\n  msfvenom         - Generate Android/Windows payloads\n  hydra            - Run Brute-Force Password Attack\n  clear            - Clear screen", 'info');
                    break;
                case 'hydra':
                    printLine("[*] Hydra v9.5 (c) 2026 by van Hauser / ThC - www.thc.org", 'info');
                    printLine("[+] Starting SSH login brute-force attack on target...", 'warn');
                    
                    let attempts = 0;
                    let passwords = ["admin", "root123", "toor", "secret123", "password"];
                    
                    let attackInterval = setInterval(() => {
                        if (attempts < passwords.length) {
                            printLine("[->] Attempting password: " + passwords[attempts], 'info');
                            attempts++;
                        } else {
                            clearInterval(attackInterval);
                            printLine("[✔] LOGIN FOUND: [ssh] host: 127.0.0.1 login: admin password: secret123", 'success');
                        }
                    }, 500);
                    break;
                case 'msfvenom':
                    printLine("[-] Initializing Metasploit Payload Generator (msfvenom)...", 'warn');
                    printLine("[*] Selected Payload: android/meterpreter/reverse_tcp", 'info');
                    printLine("[*] Injecting payload into virtual storage...", 'info');
                    
                    activeDir.content["update.apk"] = { 
                        type: "file", 
                        content: "[BINARY METASPLOIT APK PAYLOAD - LHOST=192.168.1.5 LPORT=4444]" 
                    };
                    saveVFS();

                    printLine("[✔] Payload generated successfully!", 'success');
                    printLine("[+] Saved as 'update.apk' in current directory. Use 'ls' to view.", 'purple');
                    break;
                case 'ls':
                    let keys = Object.keys(activeDir.content);
                    if (keys.length === 0) {
                        printLine("(empty directory)", 'warn');
                    } else {
                        let output = keys.map(k => activeDir.content[k].type === "dir" ? "[" + k + "]" : k).join("   ");
                        printLine(output, 'success');
                    }
                    break;
                case 'pwd':
                    printLine(currentPath, 'info');
                    break;
                case 'mkdir':
                    if (!arg) {
                        printLine("mkdir: missing operand", 'error');
                        return;
                    }
                    if (activeDir.content[arg]) {
                        printLine("mkdir: cannot create directory '" + arg + "': File exists", 'error');
                    } else {
                        activeDir.content[arg] = { type: "dir", content: {} };
                        saveVFS();
                        printLine("[+] Directory created successfully.", 'success');
                    }
                    break;
                case 'touch':
                    if (!arg) {
                        printLine("touch: missing file operand", 'error');
                        return;
                    }
                    activeDir.content[arg] = { type: "file", content: "" };
                    saveVFS();
                    printLine("[+] File created: " + arg, 'success');
                    break;
                case 'cat':
                    if (!arg) {
                        printLine("cat: missing file operand", 'error');
                        return;
                    }
                    if (activeDir.content[arg] && activeDir.content[arg].type === "file") {
                        printLine(activeDir.content[arg].content, 'info');
                    } else {
                        printLine("cat: " + arg + ": No such file or directory", 'error');
                    }
                    break;
                case 'rm':
                    if (!arg) {
                        printLine("rm: missing operand", 'error');
                        return;
                    }
                    if (activeDir.content[arg]) {
                        delete activeDir.content[arg];
                        saveVFS();
                        printLine("[+] Removed " + arg, 'success');
                    } else {
                        printLine("rm: cannot remove '" + arg + "': No such file or directory", 'error');
                    }
                    break;
                case 'cd':
                    if (!arg || arg === "~" || arg === "/") {
                        currentPath = "/";
                    } else if (arg === "..") {
                        if (currentPath !== "/") {
                            let segments = currentPath.split("/").filter(p => p);
                            segments.pop();
                            currentPath = "/" + segments.join("/");
                        }
                    } else {
                        if (activeDir.content[arg] && activeDir.content[arg].type === "dir") {
                            currentPath = currentPath === "/" ? "/" + arg : currentPath + "/" + arg;
                        } else {
                            printLine("cd: no such file or directory: " + arg, 'error');
                            return;
                        }
                    }
                    let newPrompt = "root@dx08:" + currentPath + "#";
                    promptSymbol.textContent = newPrompt;
                    pathLabel.textContent = newPrompt;
                    break;
                case 'clear':
                    screen.innerHTML = '<div class="t-green">Terminal buffer wiped.</div><br>';
                    break;
                default:
                    printLine("bash: command not found: " + mainCmd, 'error');
                    break;
            }
        }
    </script>
</body>
</html>
