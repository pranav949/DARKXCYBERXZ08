<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DX08 ELITE HACKING KERNEL // TERMUX v10</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #050505;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .term-header {
            background: #111;
            border-bottom: 1px solid #333;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }
        .term-header a {
            color: #ff3333;
            text-decoration: none;
            border: 1px solid #ff3333;
            padding: 3px 8px;
            border-radius: 3px;
            font-weight: bold;
        }
        .term-body {
            flex: 1;
            padding: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #000;
        }
        #term-screen {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 13px;
            line-height: 1.4;
            word-break: break-all;
        }
        .prompt-line {
            display: flex;
            align-items: center;
            margin-top: 6px;
            background: #0a0a0a;
            padding: 6px 8px;
            border-radius: 4px;
            border: 1px solid #222;
        }
        .p-user { color: #00ff66; font-weight: bold; margin-right: 6px; font-size: 12px; }
        #term-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            outline: none;
        }
        .t-green { color: #00ff66; }
        .t-red { color: #ff3333; font-weight: bold; }
        .t-yellow { color: #f1fa8c; }
        .t-cyan { color: #8be9fd; }
        .t-purple { color: #bd93f9; }
    </style>
</head>
<body>

    <div class="term-header">
        <span style="color: #00ffff; font-weight: bold;">⚡ root@dx08-cyber-ops:~</span>
        <a href="terminal.html">EXIT SHELL</a>
    </div>

    <div class="term-body">
        <div id="term-screen">
            <div class="t-green">==================================================</div>
            <div class="t-cyan">   DX08 ADVANCED CYBER DEFENSE & OFFENSIVE SHELL  </div>
            <div class="t-green">==================================================</div>
            <div class="t-yellow">[*] Type <span style="color:#ff3333">tools</span> to view available world hacking modules.</div>
            <div class="t-yellow">[*] Type <span style="color:#ff3333">help</span> for command manual.</div>
            <br>
        </div>

        <div class="prompt-line">
            <span class="p-user">root@dx08:~#</span>
            <input type="text" id="term-input" autofocus autocomplete="off" spellcheck="false" placeholder="Type command (e.g., tools, msfconsole)...">
        </div>
    </div>

    <script>
        const screen = document.getElementById('term-screen');
        const input = document.getElementById('term-input');

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                let cmd = input.value.trim();
                if (!cmd) return;
                printLine("root@dx08:~# " + cmd, 'user');
                executeCommand(cmd);
                input.value = '';
            }
        });

        function printLine(text, type) {
            let div = document.createElement('div');
            if (type === 'user') div.style.color = '#fff';
            else if (type === 'success') div.className = 't-green';
            else if (type === 'error') div.className = 't-red';
            else if (type === 'warn') div.className = 't-yellow';
            else if (type === 'info') div.className = 't-cyan';
            else if (type === 'purple') div.className = 't-purple';
            div.textContent = text;
            screen.appendChild(div);
            screen.scrollTop = screen.scrollHeight;
        }

        function executeCommand(command) {
            let parts = command.split(' ');
            let mainCmd = parts[0].toLowerCase();

            switch(mainCmd) {
                case 'help':
                    printLine("AVAILABLE CORE COMMANDS:\n  tools        - List world hacking frameworks (Metasploit, Nmap, Sqlmap, etc.)\n  install <tool> - Install/Setup hacking package\n  clear        - Clear terminal screen\n  whoami       - Print active user privileges\n  uname -a     - Print kernel details", 'info');
                    break;
                case 'tools':
                    printLine("WORLD HACKING SUITE MODULES:\n  1. metasploit (msfconsole) - Exploit Development & Pentesting\n  2. sqlmap                  - Automatic SQL Injection & Database Takeover\n  3. nmap                    - Network Discovery & Vulnerability Scanner\n  4. hydra                   - Lightning Fast Login Brute-forcer\n  5. sherlock                - Hunt social media accounts across social networks\n  6. aircrack-ng             - Wi-Fi Security Auditing Tools\n\nUsage: Type tool name directly to execute (e.g., sqlmap, msfconsole)", 'purple');
                    break;
                case 'install':
                    let toolName = parts[1];
                    if (!toolName) {
                        printLine("Error: specify tool to install. Example: install metasploit", 'error');
                        return;
                    }
                    printLine("Reading package lists... Done", 'warn');
                    printLine("Building dependency tree... Done", 'warn');
                    printLine("Fetching package " + toolName + " from secure DX08 repository...", 'info');
                    setTimeout(() => {
                        printLine("[+] Unpacking " + toolName + " (v5.2-stable)...", 'success');
                        printLine("[+] Setting up dependencies and setting permissions...", 'success');
                        printLine("[✔] Successfully installed " + toolName + "! You can run it now.", 'success');
                    }, 1200);
                    break;
                case 'msfconsole':
                case 'metasploit':
                    printLine("[-] Starting Metasploit Framework Console...", 'warn');
                    setTimeout(() => {
                        printLine("       =[ metasploit v6.3.4-dev                          ]", 'info');
                        printLine("+ -- --=[ 2332 exploits - 1200 auxiliary - 410 post       ]", 'info');
                        printLine("+ -- --=[ 1385 payloads - 46 encoders - 11 nops            ]", 'info');
                        printLine("\n[i] Metasploit connected to local handler. Type 'use exploit/multi/handler' to start.", 'success');
                    }, 1000);
                    break;
                case 'sqlmap':
                    printLine("        ___", 'info');
                    printLine("       __H__", 'info');
                    printLine(" ;getCode('( ' )'; \\'__'", 'info');
                    printLine(" (.--. ' /-'", 'info');
                    printLine("['. /_\\ ']", 'info');
                    printLine(" | \\", 'info');
                    printLine("[!] sqlmap/1.7.4-stable loaded. Provide target url with --url flag.", 'warn');
                    break;
                case 'nmap':
                    let target = parts[1] || "127.0.0.1";
                    printLine("Starting Nmap scan on target: " + target, 'info');
                    setTimeout(() => {
                        printLine("PORT     STATE SERVICE", 'success');
                        printLine("21/tcp   open  ftp", 'success');
                        printLine("22/tcp   open  ssh", 'success');
                        printLine("80/tcp   open  http", 'success');
                        printLine("443/tcp  open  https", 'success');
                        printLine("[+] Nmap done: 1 IP address (1 host up) scanned successfully.", 'success');
                    }, 1000);
                    break;
                case 'hydra':
                    printLine("[*] Hydra v9.5 (c) 2023 by van Hauser / ThC - www.thc.org", 'info');
                    printLine("[!] Syntax: hydra -l user -P passlist.txt ssh://target", 'warn');
                    break;
                case 'sherlock':
                    printLine("[*] Checking username across social networks...", 'info');
                    setTimeout(() => {
                        printLine("[+][-] Searching username on 400+ platforms...", 'warn');
                        printLine("[+] Target found on: GitHub, Instagram, Twitter, Telegram", 'success');
                    }, 1000);
                    break;
                case 'whoami':
                    printLine("root (UID 0 / GID 0 - Full Kernel Privileges Active)", 'success');
                    break;
                case 'uname':
                    printLine("Linux dx08-sec-kernel 6.5.0-custom-elitesec #1 SMP PREEMPT aarch64", 'info');
                    break;
                case 'clear':
                    screen.innerHTML = '<div class="t-green">Terminal buffer wiped.</div><br>';
                    break;
                default:
                    printLine("bash: command not found: " + mainCmd + ". Type 'tools' or 'help' for options.", 'error');
                    break;
            }
        }
    </script>
</body>
</html>
